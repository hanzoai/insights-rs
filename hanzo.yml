# Rust client for Hanzo Insights — ships to crates.io from a tag.
# Gate: the crate builds on its default features and its unit tests run. tests/
# drives a live ingest endpoint with an API key (that is what the `e2e-test`
# feature exists to select), so those are integration, not a push gate; --lib is
# where the flag-evaluation logic that can be wrong offline lives.
test:
  - name: build-and-unit
    run: |
      set -euo pipefail
      cargo build
      cargo test --lib
