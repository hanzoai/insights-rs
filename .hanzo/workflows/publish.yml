name: Publish

# Publishing follows a push to main. Cargo.toml holds the version, and the
# receipt is what crates.io serves -- not what `cargo publish` printed.
#
# No `paths:` filter, deliberately. The question is "does crates.io serve
# something older than this tree?", and the comparison below is the only
# thing that reads the truth. A path gate guesses it from the shape of a
# diff, so a fix that never touches Cargo.toml's version line still needs
# this to run and find nothing to do.
#
# The build gate is the same `cargo build && cargo test --lib` hanzo.yml
# already runs on every push -- the e2e suite needs a live API key and is
# integration, not a push gate, so it stays out of this path.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialized, newest wins. Two runs in flight both read crates.io before
# either publishes, so both believe the same version is unpublished and the
# slower one ships a stale tree under a number the faster one already
# defined.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Runs on every push, not only a releasing one -- a regression that
      # only surfaces on release day surfaces on the day it's most expensive.
      - name: Build and unit test
        run: |
          cargo build
          cargo test --lib

      - name: Provision jq
        # The runner image ships no jq, and the ratchet below reads the
        # crates.io API with it.
        run: |
          set -e
          command -v jq >/dev/null 2>&1 && exit 0
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
            -o "$HOME/.local/bin/jq"
          chmod +x "$HOME/.local/bin/jq"

      - name: Is the tree ahead of crates.io
        id: ahead
        run: |
          set -euo pipefail
          NAME=$(grep -m1 '^name = ' Cargo.toml | sed 's/name = "\(.*\)"/\1/')
          NEW=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          OLD=$(curl -sf "https://crates.io/api/v1/crates/$NAME" 2>/dev/null \
                  | jq -r '.crate.max_version // "0.0.0"' 2>/dev/null || echo "0.0.0")

          # FORWARD ONLY. `!=` fires in both directions and a revert would walk
          # crates.io backwards; only a strictly greater local version is a
          # release.
          NEWEST=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          if [ "$OLD" = "$NEW" ] || [ "$NEWEST" != "$NEW" ]; then
            echo "crates.io serves $OLD; tree is $NEW — nothing to publish."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "crates.io serves $OLD; tree is $NEW — publishing."
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "old=$OLD" >> "$GITHUB_OUTPUT"
            echo "new=$NEW" >> "$GITHUB_OUTPUT"
          fi

      - name: Load the publish credential from KMS
        if: steps.ahead.outputs.yes == 'true'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          # Only the KMS machine identity lives as a forge secret; a raw
          # CARGO_REGISTRY_TOKEN beside it would be a second place to hold
          # one thing -- and the one that rots silently.
          if [ -z "$KMS_CLIENT_ID" ] || [ -z "$KMS_CLIENT_SECRET" ]; then
            echo "::error::KMS machine identity absent — cannot pull the crates.io credential. Seed KMS_CLIENT_ID/KMS_CLIENT_SECRET as git.hanzo.ai Actions secrets (org or repo scope)." >&2
            exit 1
          fi
          KMS=https://kms.hanzo.ai; ENVN=prod
          TOKEN=$(curl -sf "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r .accessToken)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "::error::KMS login failed"; exit 1; }
          # The org is the token's owner claim, not a path segment, so the read
          # names only the secret: /v1/kms/secrets/<name>?env=<env>.
          URL="$KMS/v1/kms/secrets/CARGO_REGISTRY_TOKEN?env=$ENVN"
          # No -f: under `bash -e -o pipefail` a `curl -sf` on a 404 exits 22
          # and kills the step before any message of ours prints, which reads
          # like a broken network. Capture the status and say it.
          BODY=$(curl -s -w '\n%{http_code}' "$URL" -H "Authorization: Bearer $TOKEN") || true
          CODE=$(printf '%s' "$BODY" | tail -1)
          VAL=$(printf '%s' "$BODY" | sed '$d' | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "$VAL" ]; then
            echo "::error::KMS returned HTTP $CODE for $URL with no value — seed CARGO_REGISTRY_TOKEN there, not as a forge secret." >&2
            exit 1
          fi
          echo "::add-mask::$VAL"
          echo "CARGO_REGISTRY_TOKEN=$VAL" >> "$GITHUB_ENV"

      - name: Publish
        if: steps.ahead.outputs.yes == 'true'
        run: |
          echo "Publishing ${{ steps.ahead.outputs.old }} -> ${{ steps.ahead.outputs.new }}"
          cargo publish
